[databases]
quant_kb = host=final-postgres port=5432 dbname=quant_kb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# 连接池模式：transaction = 每个事务结束后连接归还池
pool_mode = transaction

# PgBouncer 到 PostgreSQL 的连接上限
max_client_conn = 4000
default_pool_size = 580
min_pool_size = 40
reserve_pool_size = 60
reserve_pool_timeout = 1

# 日志
log_connections = 0
log_disconnections = 0

# 超时
server_idle_timeout = 60
client_idle_timeout = 0
query_timeout = 60
client_login_timeout = 10

# 统计
stats_period = 60

# 忽略启动时数据库检查（容器启动顺序问题）
ignore_startup_parameters = extra_float_digits
